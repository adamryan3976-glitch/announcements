<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winchester P.S. Announcements</title>

  <!-- Icons for the browser tab and for saving to a phone's home screen -->
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b2550">
  <meta name="apple-mobile-web-app-title" content="WPS News">

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(circle at 50% 38%, #1a4f94, #0b2550);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    /* Shown while the app loads, underneath the frame. */
    .loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.25rem; text-align: center; padding: 16px; box-sizing: border-box;
    }
    .loading img { width: 160px; height: 160px; }
    .loading h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
    .loading p { margin: 0; opacity: .8; font-size: .9rem; }

    /* The announcements app, filling the window. */
    iframe {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; display: block; background: transparent;
    }

    /* Way out for browsers that block Google sign-in inside a page. */
    a.direct {
      position: fixed; right: 12px; bottom: 12px; z-index: 2;
      background: #0b2550; color: #fff; text-decoration: none;
      font-size: .8rem; font-weight: 600; line-height: 1;
      padding: .55rem .85rem; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
      opacity: .85;
    }
    a.direct:hover, a.direct:focus-visible { opacity: 1; }
    a.direct:focus-visible { outline: 3px solid #45dcf7; outline-offset: 2px; }
    a.direct span { font-weight: 400; opacity: .8; }
  </style>
</head>
<body>
  <div class="loading" aria-hidden="true">
    <img src="icons/logo-512.png" alt="">
    <h1>Winchester P.S. Announcements</h1>
    <p>Loading today's announcements…</p>
  </div>

  <iframe id="app" title="Winchester P.S. Announcements"
    allow="fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write"
    allowfullscreen></iframe>

  <a class="direct" id="direct" target="_top" rel="noopener"><span>Not loading?</span> Open directly</a>

  <script>
    var APP_URL = 'https://script.google.com/a/macros/ddsb.ca/s/AKfycbzv2ntYL7D4LojxKuQ0kiLpQKCw41MymPX-LH4nP1HJSKq7_-nr9i9kTyPq_CXxcZXlEw/exec';

    // Pass along ?view=... so links like announcements.winchesterps.ca/?view=new still work.
    var url = APP_URL + location.search;
    document.getElementById('app').src = url;
    document.getElementById('direct').href = url;
  </script>
</body>
</html>

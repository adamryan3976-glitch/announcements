<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Winchester P.S. Announcements</title>

  <!-- Icons for the browser tab and for saving to a phone's home screen -->
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b2550">
  <meta name="apple-mobile-web-app-title" content="WPS News">

  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(circle at 50% 38%, #1a4f94, #0b2550);
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.25rem; text-align: center; padding: 16px; box-sizing: border-box;
    }
    img { width: 160px; height: 160px; }
    h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
    a.go {
      background: #f0b032; color: #0b2550; font-weight: 700; text-decoration: none;
      padding: .8rem 1.6rem; border-radius: 999px;
    }
    a.go:focus-visible { outline: 3px solid #45dcf7; outline-offset: 3px; }
    p { margin: 0; opacity: .8; font-size: .9rem; }

    /* Full-screen view of the Google web app. The launcher above stays
       underneath as the fallback if the frame can't load. */
    #app {
      position: fixed; inset: 0; width: 100%; height: 100%;
      border: 0; background: #fff; display: none;
    }
    body.embedded #app { display: block; }
    #direct {
      position: fixed; right: 8px; bottom: 8px; z-index: 2; display: none;
      font-size: .75rem; color: #0b2550; background: rgba(255,255,255,.85);
      border: 1px solid #c9d3e3; border-radius: 999px; padding: .25rem .7rem;
      text-decoration: none; opacity: .55;
    }
    #direct:hover, #direct:focus-visible { opacity: 1; }
    body.embedded #direct { display: block; }
  </style>
</head>
<body>
  <img src="icons/logo.svg" alt="Winchester P.S. Knights">
  <h1>Winchester P.S. Announcements</h1>
  <a class="go" id="go" href="https://script.google.com/a/macros/ddsb.ca/s/AKfycbxfOfWmAHl3HXVitB70oWOZuNKeasRwB3fq5SVCHaP2z1BycROjhazJvG3UK0dA_UJr/exec">Open today's announcements</a>
  <p>Sign in with your DDSB account.</p>
  <noscript><p>Turn on JavaScript, or use the button above.</p></noscript>

  <iframe id="app" title="Winchester P.S. Announcements"
    allow="fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write"
    allowfullscreen></iframe>
  <a id="direct" target="_top">Trouble loading? Open directly</a>

  <script>
    var appUrl = document.getElementById('go').href;
    // Pass ?view=new etc. through to the app.
    if (location.search) appUrl += location.search;
    document.getElementById('go').href = appUrl;
    document.getElementById('direct').href = appUrl;

    var fromHomeScreen = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

    if (fromHomeScreen) {
      // Opened from the home-screen icon: go straight to the app.
      location.replace(appUrl);
    } else {
      // In a browser: show the app full screen, keeping this address.
      document.getElementById('app').src = appUrl;
      document.body.classList.add('embedded');
    }
  </script>
</body>
</html>

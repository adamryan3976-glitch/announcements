<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Winchester Clue</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1a33">
<meta property="og:image" content="logo.jpg">
<meta name="description" content="What did the butler see? The case file, evidence board and class answer sheet for our Clue week.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Libre+Franklin:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: a 1940s radio-theatre case file. Dark broadcast masthead with a five-day dial, then the evidence board, the case log and the class answer sheet. */
:root{
  --bg:#ebe7f0; --surface:#fbf9fd; --sunk:#e1dbe9; --fg:#221a30; --muted:#5e5570; --line:#d2c9de;
  --brass:#87570f; --brass-soft:#f3e5c8; --stamp:#b3261e; --stamp-soft:#f8dedb; --ok:#2d6a38; --ok-soft:#dcefdc;
  --mast:#13203d; --mast-fg:#f2f5fb; --mast-muted:#aeb9d0; --glow:#f2b84b;
  --display:"Limelight","Didot","Bodoni 72",Georgia,serif;
  --body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Courier Prime","Courier New",Courier,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14111c; --surface:#1d1828; --sunk:#17131f; --fg:#efe9f6; --muted:#a59bb7; --line:#342c44;
  --brass:#e6b45a; --brass-soft:#3a2f1a; --stamp:#ff7a6c; --stamp-soft:#3d1c1a; --ok:#86d293; --ok-soft:#1b3320;
  --mast:#0a1124; --mast-fg:#f2f5fb; --mast-muted:#a3aec6; --glow:#f2b84b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14111c; --surface:#1d1828; --sunk:#17131f; --fg:#efe9f6; --muted:#a59bb7; --line:#342c44;
  --brass:#e6b45a; --brass-soft:#3a2f1a; --stamp:#ff7a6c; --stamp-soft:#3d1c1a; --ok:#86d293; --ok-soft:#1b3320;
  --mast:#0a1124; --mast-fg:#f2f5fb; --mast-muted:#a3aec6; --glow:#f2b84b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.2rem);letter-spacing:.01em}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
a{color:var(--brass)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em;font-size:.78rem}
.tabnum{font-variant-numeric:tabular-nums}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--mast);color:var(--mast-fg);border-bottom:1px solid #00000040}
.nav .wrap{display:flex;gap:4px 18px;align-items:center;flex-wrap:wrap;padding-block:8px}
.nav .brand{font-family:var(--display);font-size:1.15rem;margin-right:auto;color:var(--mast-fg);text-decoration:none}
.nav a.l{color:var(--mast-muted);text-decoration:none;font-size:.92rem;padding:4px 0}
.nav a.l:hover,.nav a.l[aria-current="page"]{color:var(--mast-fg)}
.nav .desk-btn{background:var(--glow);color:#241a05;border:0;border-radius:999px;padding:5px 14px;font-weight:600;font-size:.88rem;cursor:pointer}

/* masthead */
.mast{background:var(--mast);color:var(--mast-fg);padding-block:44px 40px;position:relative;overflow:hidden}
.mast::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 85% 10%,#f2b84b22,transparent 60%),repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 6px);pointer-events:none}
.mast .wrap{position:relative;display:grid;gap:18px}
.onair{display:inline-flex;align-items:center;gap:8px;color:var(--glow)}
.onair i{width:9px;height:9px;border-radius:50%;background:#ff4d3d;box-shadow:0 0 10px #ff4d3d;animation:blink 2.4s infinite}
@keyframes blink{0%,60%{opacity:1}70%,90%{opacity:.25}}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(2.3rem,7vw,4.6rem);line-height:1.02;color:var(--mast-fg)}
.mast h1 em{font-style:normal;color:var(--glow)}
.mast .lede{max-width:62ch;color:var(--mast-muted);font-size:1.06rem}
.next{font-family:var(--mono);font-size:.95rem;color:var(--mast-fg);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.next b{color:var(--glow);font-weight:700}

/* dial */
.dial{margin-top:6px;background:#00000033;border:1px solid #ffffff1c;border-radius:14px;padding:16px 18px 12px}
.dial-scale{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.dial-day{position:relative;text-align:center;padding-top:30px}
.dial-day .ticks{position:absolute;top:0;left:12%;right:12%;display:flex;justify-content:space-between;height:20px;align-items:flex-end}
.dial-day .ticks span{width:3px;height:14px;border-radius:2px;background:#ffffff2e}
.dial-day .ticks span.lit{background:var(--glow);box-shadow:0 0 8px var(--glow)}
.dial-day b{display:block;font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;color:var(--mast-muted)}
.dial-day small{display:block;font-family:var(--mono);font-size:.82rem;color:var(--mast-fg)}
.dial-day.now b{color:var(--glow)}
.dial-line{position:absolute;left:0;right:0;top:20px;height:1px;background:#ffffff26}
.needle{position:absolute;top:-6px;width:2px;height:34px;background:#ff4d3d;box-shadow:0 0 8px #ff4d3d;transition:left .6s ease}

/* sections */
section.band{padding-block:44px}
section.band + section.band{border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;gap:12px 20px;align-items:end;flex-wrap:wrap;margin-bottom:20px}
.sec-head p{max-width:60ch}

/* closed banner */
.closed{background:var(--surface);border:2px solid var(--stamp);border-radius:16px;padding:26px;display:grid;gap:14px;position:relative}
.closed .big{font-family:var(--display);font-size:clamp(1.8rem,5vw,3rem);color:var(--stamp);transform:rotate(-2deg);display:inline-block;border:3px solid var(--stamp);padding:2px 14px;border-radius:6px;justify-self:start}
.solution{display:flex;flex-wrap:wrap;gap:8px}
.solution span{background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:4px 14px;font-weight:700}
blockquote.story{margin:0;padding:14px 18px;border-left:4px solid var(--brass);background:var(--sunk);border-radius:0 10px 10px 0;white-space:pre-wrap}

/* board */
.board-group{display:grid;gap:10px;margin-bottom:22px}
.board-group h3{font-family:var(--mono);font-size:.8rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;text-align:left;cursor:pointer;transition:transform .15s ease}
.card:hover{transform:translateY(-2px)}
.card .pic{aspect-ratio:1/1;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--brass)}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .pic svg{width:46%;height:46%}
.card .nm{font-weight:700;line-height:1.2}
.card .nt{font-size:.84rem;color:var(--muted);line-height:1.35}
.card .by{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.card.out .pic,.card.out .nm,.card.out .nt{opacity:.42}
.card .stamp{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);font-family:var(--mono);font-weight:700;letter-spacing:.08em;color:var(--stamp);border:3px solid var(--stamp);border-radius:6px;padding:2px 10px;background:color-mix(in srgb,var(--surface) 82%,transparent);font-size:.95rem;white-space:nowrap;pointer-events:none}
.card.seen{border:2px solid var(--ok)}
.card .stamp.seen{color:var(--ok);border-color:var(--ok)}
.card .pencil{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:.74rem;background:var(--brass-soft);color:var(--brass);border-radius:999px;padding:1px 8px;font-weight:700}
.notebar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.notebar button{background:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;color:var(--muted)}

/* letter */
.letter{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 24px;font-family:var(--mono);font-size:.95rem;line-height:1.6;max-width:62ch;display:grid;gap:10px;box-shadow:0 1px 0 var(--line),0 10px 24px -18px #00000080}
.letter .sig{font-style:italic}

/* case log */
.log{display:grid;gap:26px}
.log-day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px}
@media (max-width:640px){.log-day{grid-template-columns:minmax(0,1fr)}}
.log-day > .lbl{font-family:var(--display);font-size:1.6rem;color:var(--brass);line-height:1}
.log-day > .lbl small{display:block;font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-top:6px}
.entries{display:grid;gap:14px;min-width:0}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.entry .when{font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.entry p{max-width:68ch}
.riddle{margin:0;background:var(--brass-soft);border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.riddle figcaption{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--brass);font-weight:700}
.riddle blockquote{margin:0;font-size:1.2rem;font-weight:600;line-height:1.4}
.riddle img{border-radius:8px;max-height:520px;width:auto;justify-self:start;background:#fff}
.points{margin:0;padding-left:20px;display:grid;gap:4px}
.points-h{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border-radius:999px;padding:2px 12px;font-size:.88rem;font-weight:600}
.chip.x{background:var(--stamp-soft);color:var(--stamp);text-decoration:line-through}
.tb{font-family:var(--mono);font-size:.92rem}

/* hall */
.hall{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.trophy{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.trophy .r{font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.trophy b{font-size:1.1rem}

/* forms */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:16px;max-width:760px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-weight:600;font-size:.94rem}
.field .hint{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=number],input[type=email],input[type=date],input[type=time],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;justify-self:start}
.btn.brass{background:var(--brass);color:var(--surface)}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:.86rem;font-weight:600}
.btn.danger{background:var(--stamp);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sendbox{border:2px dashed var(--brass);border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--brass-soft)}
.sendbox pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:.9rem;background:var(--surface);border-radius:8px;padding:10px 12px;user-select:all}
.ok-note{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 14px;font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* desk */
.desk-head{background:var(--mast);color:var(--mast-fg);padding-block:26px}
.desk-head .wrap{display:grid;gap:14px}
.desk-head h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.6rem)}
.desk-head p{color:var(--mast-muted);max-width:70ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#ffffff14;color:var(--mast-fg);border:1px solid #ffffff22;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--glow);color:#241a05;border-color:transparent}
.panel{padding-block:28px 60px;display:grid;gap:24px}
.due-banner{background:var(--brass-soft);border:1px solid var(--brass);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.day-block{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day-block > header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}
.day-block > header h3{font-family:var(--display);font-weight:400;font-size:1.5rem}
.day-block > header .today{font-family:var(--mono);font-size:.78rem;color:var(--surface);background:var(--brass);border-radius:999px;padding:2px 10px}
.day-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
@media (max-width:820px){.day-body{grid-template-columns:minmax(0,1fr)}}
.rel-list,.check-list{padding:12px 18px 16px;display:grid;gap:10px;align-content:start;min-width:0}
.check-list{border-left:1px solid var(--line)}
@media (max-width:820px){.check-list{border-left:0;border-top:1px solid var(--line)}}
.rel{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.rel:last-child{border-bottom:0}
.rel-top{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.rel-top .t{font-family:var(--mono);font-size:.85rem;color:var(--muted);min-width:5.5em}
.rel-top .lab{font-weight:600;margin-right:auto}
.pill{font-family:var(--mono);font-size:.74rem;border-radius:999px;padding:1px 9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pill.live{background:var(--ok-soft);color:var(--ok)}
.pill.due{background:var(--stamp-soft);color:var(--stamp)}
.pill.sched{background:var(--sunk);color:var(--muted)}
.check-list h4,.rel-list h4{margin:0;font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.93rem;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--brass)}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.preview{border-top:1px dashed var(--line);padding-top:10px}
.edit-box{display:grid;gap:8px;background:var(--sunk);padding:12px;border-radius:10px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.yes{color:var(--ok);font-weight:700}.no{color:var(--stamp);font-weight:700}
tr.crowned td{background:var(--brass-soft)}
.winner-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pad{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.pad .play{display:flex;align-items:center;gap:12px;background:var(--mast);color:var(--mast-fg);border:0;border-radius:12px;padding:16px;cursor:pointer;text-align:left;font-weight:700;font-size:1.02rem}
.pad .play .k{font-family:var(--mono);background:#ffffff1f;border-radius:6px;padding:1px 8px}
.pad .play.on{background:var(--glow);color:#241a05}
.pad .play[disabled]{opacity:.45;cursor:not-allowed}
.pad .fn{font-size:.84rem;color:var(--muted);word-break:break-word}
.setup-grid{display:grid;gap:22px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
.box h3{font-family:var(--display);font-weight:400;font-size:1.35rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{display:grid;gap:6px;font-size:.88rem}
.ph .pic{aspect-ratio:1/1;max-width:100%;background:var(--sunk);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.ph .pic img{width:100%;height:100%;object-fit:cover}
.ph input[type=file]{font-size:.8rem;max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
footer.foot{padding-block:30px 50px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mast-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:28px;align-items:center}
.mast-copy{display:grid;gap:18px;min-width:0;order:1}
.mast-logo{order:2;width:100%;max-width:300px;height:auto;justify-self:end;border-radius:14px;box-shadow:0 18px 40px -18px #000c,0 0 0 1px #ffffff1a}
@media (max-width:760px){.mast-grid{grid-template-columns:minmax(0,1fr);gap:18px}.mast-logo{order:0;max-width:210px;justify-self:start}}
.nav .brand{display:inline-flex;align-items:center;gap:10px}
.nav .brand img{width:28px;height:28px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px #ffffff33}
.footrow{display:flex;gap:10px 20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}
.linkbtn:hover{color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px}

</style>
</head>

function dayDate(n) { const p = (PUB.settings.day1 || '2026-10-26').split('-').map(Number); const dt = new Date(p[0], p[1] - 1, p[2]); let added = 0; while (added < n - 1) { dt.setDate(dt.getDate() + 1); const w = dt.getDay(); if (w !== 0 && w !== 6) added++; } return dt; }

function fmtDay(d) { return d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }); }
function fmtTime(d) { return d.toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' }); }
function isRel(id) { return !!PUB.released[id]; }
function roundOpen(r) { const R = ROUNDS[r]; return isRel(R.opens) && !isRel(R.closes); }

function tsMillis(t) { if (!t) return 0; if (typeof t.toMillis === 'function') return t.toMillis(); return Date.parse(t) || 0; }
function allRows(r) {
  const latest = {}, counts = {};
  SUBS.filter(s => s.round === r).forEach(s => {
    const k = String(s.cls || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    counts[k] = (counts[k] || 0) + 1;
    if (!latest[k] || tsMillis(s.at) >= tsMillis(latest[k].at)) latest[k] = s;
  });
  const A = SEC.answers && SEC.answers[r];
  const rows = Object.keys(latest).map(k => Object.assign({}, latest[k], { times: counts[k] }));
  rows.forEach(x => {
    if (r === 'final') { const f = A || {}; x.ok = !!(x.person === f.person && x.place === f.place && x.thing === f.thing); }
    else {
      const want = ((A && A.a) || []).slice().sort().join(','), got = [x.a1, x.a2].filter(Boolean).sort().join(',');
      x.ok = !!want && want === got;
      const tb = Number(x.tb), ans = A && A.tb;
      x.diff = (ans != null && ans !== '' && x.tb !== '' && x.tb != null && !isNaN(tb)) ? Math.abs(tb - Number(ans)) : null;
    }
  });
  rows.sort((a, b) => { if (a.ok !== b.ok) return a.ok ? -1 : 1; const da = a.diff == null ? 1e15 : a.diff, dbb = b.diff == null ? 1e15 : b.diff; if (da !== dbb) return da - dbb; return tsMillis(a.at) - tsMillis(b.at); });
  return rows;
}

  h += '<div class="box"><h3>Secret settings</h3><p class="muted">Not shown on the public site until you release the answer.</p><div class="row2">' + [['r2','Day 2: seconds Wadsworth balances a teacup'],['r3','Day 3: steps from the front doors to the library'],['r4','Day 4: seconds for 3 front-foyer laps']].map(x => '<div class="field"><label for="s-tb-' + x[0] + '">' + x[1] + '</label><input type="number" id="s-tb-' + x[0] + '" min="0" step="1" value="' + esc(ans[x[0]] && ans[x[0]].tb != null ? ans[x[0]].tb : '') + '"></div>').join('') + '</div><p class="muted">Make up the teacup number; measure the steps and the laps. Nobody can check these, so the closest guess is simply the closest to your number.</p><button class="btn sm" type="button" data-savelap="1">Save tiebreaker answers</button></div>';
  h += '<div class="box"><h3>Picture puzzles</h3><p class="muted">Upload the two poster puzzles from the Posters of Clues file (a screenshot or photo is fine). They stay hidden until you release that morning’s broadcast.</p><div class="photos">' + POSTERS.map(p => '<div class="ph"><div class="pic" id="post-' + p[0] + '">Not uploaded</div><b>' + esc(p[1]) + '</b><input type="file" accept="image/*" id="s-post-' + p[0] + '" data-poster="' + p[0] + '" aria-label="Upload ' + esc(p[1]) + '"></div>').join('') + '</div></div>';
  return h;
}
function loadPosterThumbs() { POSTERS.forEach(p => { getDoc(doc(db, 'posters', p[0])).then(s => { const el = $('#post-' + p[0]); if (el && s.exists() && s.data().data) el.innerHTML = '<img src="' + s.data().data + '" alt="">'; }).catch(() => {}); }); }
function loadImg(file) { return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file); img.onload = () => { URL.revokeObjectURL(u); res(img); }; img.onerror = () => rej(new Error('That file isn’t an image this browser can read.')); img.src = u; }); }
async function shrink(file, max, q) { const img = await loadImg(file); const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q || 0.82); }
async function cropSquare(file, size) { const img = await loadImg(file); const w = img.naturalWidth, h = img.naturalHeight, m = Math.min(w, h); const c = document.createElement('canvas'); c.width = size; c.height = size; c.getContext('2d').drawImage(img, (w - m) / 2, (h - m) / 2.6, m, m, 0, 0, size, size); return c.toDataURL('image/jpeg', 0.82); }

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-go],[data-note],[data-clearnotes],[data-signin],[data-tab],[data-release],[data-unrelease],[data-preview],[data-edit],[data-saveedit],[data-canceledit],[data-rtab],[data-crown],[data-uncrown],[data-delsub],[data-play],[data-stopall],[data-unload],[data-clearphoto],[data-savelap],[data-reset]');
  if (!t) return;
  const a = t.dataset;
  if (a.go) {
    ev.preventDefault();
    VIEW = a.go === 'desk' && CAN_EDIT ? 'desk' : 'public';
    history.replaceState(null, '', VIEW === 'desk' ? '#desk' : '#top'); render(); scrollTo(0, 0); return;
  }
  if (a.note) { const cur = NOTES[a.note]; if (!cur) NOTES[a.note] = 'sus'; else if (cur === 'sus') NOTES[a.note] = 'out'; else delete NOTES[a.note]; LS.set('wps-notes', NOTES); const y = scrollY; renderTop(); scrollTo(0, y); const b = $('[data-note="' + a.note + '"]'); if (b) b.focus({ preventScroll: true }); return; }
  if (a.clearnotes) { NOTES = {}; LS.set('wps-notes', NOTES); const y = scrollY; renderTop(); scrollTo(0, y); return; }
  if (a.signin) {
    if (!auth) { toast('Connect Firebase first (see the README).'); return; }
    if (USER) { signOut(auth); return; }
    signInWithPopup(auth, new GoogleAuthProvider()).catch(e => { if (e.code !== 'auth/popup-closed-by-user') toast('Sign-in didn’t work: ' + (e.code || e.message), 6000); });
    return;
  }
  if (a.tab) { DESKTAB = a.tab; LS.set('wps-desk-tab', DESKTAB); EDITING = null; $$('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === DESKTAB))); renderPanel(); return; }
  if (a.release) { t.disabled = true; releaseIds(a.release.split(',')).finally(() => { t.disabled = false; }); return; }
  if (a.unrelease) { const upd = {}; upd['released.' + a.unrelease] = deleteField(); setPosterReleased([a.unrelease], false).then(() => pubUpdate(upd, 'Taken down from the public site.')); return; }
  if (a.preview) { const box = $('#pv-' + a.preview); if (box.innerHTML) { box.innerHTML = ''; return; } const it = ITEMS.find(i => i.id === a.preview); previewItem(it, box); return; }
  if (a.edit) { const c = (SEC.content.items[a.edit]) || {}; EDITING = a.edit; $('#pv-' + a.edit).innerHTML = '<div class="edit-box"><div class="field"><label for="ed-title">Heading</label><input type="text" id="ed-title" value="' + esc(c.title || '') + '"></div><div class="field"><label for="ed-body">Text (leave a blank line between paragraphs)</label><textarea id="ed-body" style="min-height:200px">' + esc(c.body || '') + '</textarea></div><div class="btnrow"><button class="btn sm" type="button" data-saveedit="' + a.edit + '">Save wording</button><button class="btn sm ghost" type="button" data-canceledit="1">Cancel</button></div><p class="muted" style="font-size:.85rem">Already released? Take it down and release it again to update the public site.</p></div>'; return; }
  if (a.saveedit) { const upd = {}; upd['items.' + a.saveedit + '.title'] = $('#ed-title').value; upd['items.' + a.saveedit + '.body'] = $('#ed-body').value; EDITING = null; updateDoc(doc(db, 'secret', 'content'), upd).then(() => toast('Wording saved.'), e => toast('Couldn’t save: ' + (e.code || e.message))); return; }
  if (a.canceledit) { EDITING = null; renderPanel(); return; }
  if (a.rtab) { ROUNDTAB = a.rtab; LS.set('wps-round-tab', ROUNDTAB); renderPanel(); return; }
  if (a.crown) { const r = ROUNDTAB, row = allRows(r).find(x => x.id === a.crown); if (!row) return; const upd = {}; upd['winners.' + r] = r === 'final' ? { cls: row.cls, story: row.story || '' } : { cls: row.cls }; pubUpdate(upd, r === 'final' ? 'Featured. It shows on the public site with “Case closed”.' : 'Winner announced on the public site.'); return; }
  if (a.uncrown) { const upd = {}; upd['winners.' + a.uncrown] = deleteField(); pubUpdate(upd, 'Winner removed.'); return; }
  if (a.delsub) { const row = SUBS.find(s => s.id === a.delsub); const k = row && String(row.cls || '').toLowerCase().replace(/[^a-z0-9]/g, ''); const ids = SUBS.filter(s => s.round === ROUNDTAB && String(s.cls || '').toLowerCase().replace(/[^a-z0-9]/g, '') === k).map(s => s.id); const b = writeBatch(db); ids.forEach(id => b.delete(doc(db, 'subs', id))); b.commit().then(() => toast('Removed.'), e => toast('Couldn’t remove: ' + (e.code || e.message))); return; }
  if (a.play) { play(a.play); return; }
  if (a.stopall) { stopAll(); return; }
  if (a.unload) { idbDel(a.unload).then(loadPads); return; }
  if (a.clearphoto) { PEND[a.clearphoto] = null; $('#php-' + a.clearphoto).innerHTML = iconFor(sus(a.clearphoto)); t.remove(); return; }
  if (a.savelap) { const upd = {}; ['r2', 'r3', 'r4'].forEach(k => { const v = $('#s-tb-' + k).value; upd[k + '.tb'] = v === '' ? null : Number(v); }); updateDoc(doc(db, 'secret', 'answers'), upd).then(() => toast('Tiebreaker answers saved.'), e => toast('Couldn\u2019t save: ' + (e.code || e.message))); return; }
  if (a.reset) {
    if (a.reset === 'ask') { $('#resetrow').innerHTML = '<span>Take everything off the public site?</span><button class="btn sm danger" type="button" data-reset="yes">Yes, reset</button><button class="btn sm ghost" type="button" data-reset="no">Keep it</button>'; }
    else if (a.reset === 'yes') { doReset($('#reset-subs') && $('#reset-subs').checked); }
    else renderPanel();
  }
});
async function previewItem(it, box) {
  const c = contentFor(it.id), imgs = {};
  for (const r of (c.riddles || [])) if (r.posterKey) { try { const s = await getDoc(doc(db, 'posters', r.posterKey)); if (s.exists()) imgs[r.posterKey] = s.data().data; } catch (e) {} }
  box.innerHTML = '<div class="preview">' + itemCard(it, c, { noWinner: true, posterImg: imgs }) + '</div>';
}
async function doReset(alsoSubs) {
  const ok = await pubUpdate({ released: {}, winners: {} }, null);
  for (const p of POSTERS) { try { await updateDoc(doc(db, 'posters', p[0]), { released: false }); } catch (e) {} }
  if (ok && alsoSubs) {
    try { const q = await getDocs(collection(db, 'subs')); let b = writeBatch(db), n = 0; for (const d of q.docs) { b.delete(d.ref); if (++n % 400 === 0) { await b.commit(); b = writeBatch(db); } } await b.commit(); } catch (e) { toast('Couldn’t delete the answer sheets: ' + (e.code || e.message)); }
  }
  if (ok) toast('The public site is back to the start.');
}
function selectAll(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
document.addEventListener('change', ev => {
  const t = ev.target, a = t.dataset || {};
  if (a.check) { const done = clone(SEC.check.done || {}); if (t.checked) done[a.check] = true; else delete done[a.check]; SEC.check = { done }; setDoc(doc(db, 'secret', 'checklist'), { done }).catch(() => toast('Couldn’t save the checklist.')); return; }
  if (a.load && t.files && t.files[0]) { const f = t.files[0]; idbPut(a.load, { name: f.name, blob: f }).then(loadPads, () => toast('This browser wouldn’t store the file.')); return; }
  if (a.photo && t.files && t.files[0]) { cropSquare(t.files[0], 360).then(d => { PEND[a.photo] = d; $('#php-' + a.photo).innerHTML = '<img src="' + d + '" alt="">'; toast('Photo ready. Press Save to show it.'); }, e => toast(e.message)); return; }
  if (a.poster && t.files && t.files[0]) {
    const k = a.poster, item = POSTERS.find(p => p[0] === k)[2];
    shrink(t.files[0], 900, 0.8).then(d => setDoc(doc(db, 'posters', k), { data: d, name: t.files[0].name, released: isRel(item) }).then(() => { $('#post-' + k).innerHTML = '<img src="' + d + '" alt="">'; toast('Poster saved. It stays hidden until release.'); })).catch(e => toast('Couldn’t save the poster: ' + (e.code || e.message)));
    return;
  }
  if (a.casefile && t.files && t.files[0]) { loadCaseFile(t.files[0]); return; }
});
async function loadCaseFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t valid JSON.'); return; }
  if (!data || !data.content || !data.content.items || !data.answers) { toast('That isn’t the Clue case file. Look for clue-casefile.json.'); return; }
  try {
    const b = writeBatch(db);
    b.set(doc(db, 'secret', 'content'), data.content);
    b.set(doc(db, 'secret', 'answers'), data.answers);
    const ps = await getDoc(doc(db, 'public', 'state'));
    if (!ps.exists()) b.set(doc(db, 'public', 'state'), clone(DEFAULT_PUB));
    await b.commit();
    toast('Case file loaded. You’re ready to run the week.', 5000);
    renderPanel();
  } catch (e) { toast('Couldn’t load it: ' + (e.code || e.message), 6000); }
}
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === 'subform') { onSubmit(f); return; }
  if (f.id === 'paperform') {
    const r = ROUNDTAB, R = ROUNDS[r], e = { round: r, cls: $('#pp-cls').value.trim(), src: 'Paper', at: serverTimestamp() };
    if (!e.cls) return;
    if (R.final) { e.person = $('#pp-person').value; e.place = $('#pp-place').value; e.thing = $('#pp-thing').value; e.story = $('#pp-story').value.trim(); }
    else { R.fields.forEach(x => { e[x[0]] = $('#pp-' + x[0]).value; }); e.tb = String($('#pp-tb').value); }
    addDoc(collection(db, 'subs'), e).then(() => toast('Sheet added.'), err => toast('Couldn’t add it: ' + (err.code || err.message)));
    return;
  }
  if (f.id === 'setupform') { saveSetup(); }
});
async function saveSetup() {
  const st = clone(PUB.settings);
  const seen = {}; st.classes = $('#s-classes').value.split('\n').map(x => x.replace(/\|/g, '/').trim().slice(0, 80)).filter(x => x && !seen[x] && (seen[x] = 1));
  st.school = $('#s-school').value.trim() || 'Our School'; st.day1 = $('#s-day1').value || st.day1;
  st.times = { am: $('#s-am').value || '09:00', mid: $('#s-mid').value || '13:00', pm: $('#s-pm').value || '15:00' };
  S.filter(s => s.g === 'person').forEach(s => {
    const nm = $('#s-name-' + s.id).value.trim(); if (nm && nm !== s.name) st.names[s.id] = nm; else delete st.names[s.id];
    const ac = $('#s-actor-' + s.id).value.trim(); if (ac) st.actors[s.id] = ac; else delete st.actors[s.id];
  });
  try {
    const b = writeBatch(db);
    b.update(doc(db, 'public', 'state'), { settings: st });
    Object.keys(PEND).forEach(k => { if (PEND[k]) b.set(doc(db, 'photos', k), { data: PEND[k] }); else b.delete(doc(db, 'photos', k)); });
    await b.commit(); PEND = {}; toast('Saved. The public site is updated.');
  } catch (e) { toast('Couldn’t save: ' + (e.code || e.message), 6000); }
}
document.addEventListener('keydown', ev => {
  if (VIEW !== 'desk' || DESKTAB !== 'sound') return;
  if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
  if (ev.key === 'Escape') { stopAll(); return; }
  const n = Number(ev.key); if (n >= 1 && n <= SLOTS.length) { ev.preventDefault(); play(SLOTS[n - 1][0]); }
});

/* ---------- rendering + live data ---------- */
function render() { if (VIEW === 'desk' && CAN_EDIT) renderDesk(); else { VIEW = 'public'; renderPublic(); } }
function refreshAfterPubChange() {
  if (VIEW === 'desk') { if (!EDITING && (DESKTAB === 'show' || DESKTAB === 'answers')) renderPanel(); return; }
  const y = scrollY; const nav0 = $('.nav'); if (nav0) nav0.outerHTML = nav();
  renderTop(); renderSheet(false); scrollTo(0, y);
  ensurePosters();
}
function ensurePosters() {
  ITEMS.forEach(it => {
    const c = PUB.released[it.id]; if (!c) return;
    (c.riddles || []).forEach(r => {
      if (!r.posterKey || POSTER_IMG[r.posterKey] !== undefined) return;
      POSTER_IMG[r.posterKey] = null;
      getDoc(doc(db, 'posters', r.posterKey)).then(s => { if (s.exists() && s.data().data) { POSTER_IMG[r.posterKey] = s.data().data; if (VIEW === 'public') { const y = scrollY; renderTop(); scrollTo(0, y); } } }).catch(() => { delete POSTER_IMG[r.posterKey]; });
    });
  });
}
function startDesk() {
  stopDesk();
  let pending = 3;
  const mark = () => { if (--pending <= 0) SEC.loaded = true; if (VIEW === 'desk' && !EDITING && (DESKTAB === 'show' || DESKTAB === 'answers')) renderPanel(); };
  DESK_UNSUBS.push(onSnapshot(doc(db, 'secret', 'content'), s => { SEC.content = s.exists() ? s.data() : null; mark(); }, mark));
  DESK_UNSUBS.push(onSnapshot(doc(db, 'secret', 'answers'), s => { SEC.answers = s.exists() ? s.data() : null; mark(); }, mark));
  getDoc(doc(db, 'secret', 'checklist')).then(s => { SEC.check = s.exists() ? s.data() : { done: {} }; mark(); }, mark);
  DESK_UNSUBS.push(onSnapshot(collection(db, 'subs'), q => {
    SUBS = q.docs.map(d => Object.assign({ id: d.id }, d.data({ serverTimestamps: 'estimate' })));
    if (VIEW === 'desk' && DESKTAB === 'answers') renderPanel();
  }, () => {}));
}
function stopDesk() { DESK_UNSUBS.forEach(u => { try { u(); } catch (e) {} }); DESK_UNSUBS = []; SEC = { content: null, answers: null, check: { done: {} }, loaded: false }; SUBS = []; }

render();
if (CONFIGURED) {
  onSnapshot(doc(db, 'public', 'state'), s => {
    PUB = normalize(s.exists() ? s.data() : null); PUB_LOADED = true;
    refreshAfterPubChange();
  }, () => { PUB_LOADED = true; refreshAfterPubChange(); });
  onSnapshot(collection(db, 'photos'), q => {
    PHOTOS = {}; q.forEach(d => { PHOTOS[d.id] = d.data().data; });
    if (VIEW === 'public') { const y = scrollY; renderTop(); scrollTo(0, y); }
  }, () => {});
  onAuthStateChanged(auth, async u => {
    USER = u; CAN_EDIT = false;
    if (u && u.email) { try { const p = await getDoc(doc(db, 'producers', u.email)); CAN_EDIT = p.exists(); } catch (e) { CAN_EDIT = false; } }
    if (CAN_EDIT) startDesk(); else { stopDesk(); if (u) toast('Signed in as ' + u.email + ', but that account isn’t a producer for this site.', 6000); }
    if (CAN_EDIT && (location.hash === '#desk' || LS.get('wps-view', '') === 'desk')) VIEW = 'desk';
    render();
  });
}
window.addEventListener('hashchange', () => { LS.set('wps-view', location.hash === '#desk' ? 'desk' : 'public'); });

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winchester P.S. — Today's Announcements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14213D;
    --cream:#FBF7EF;
    --gold:#C99A2E;
    --green:#2D4739;
    --charcoal:#1F2421;
    --rule:#D8D2C4;
    --announcement-size: 1.5rem;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--cream);
    color:var(--charcoal);
    font-family:'Public Sans', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--navy);
    color:var(--cream);
    padding:1.4rem 3rem;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.5rem 2rem;
    border-bottom:6px solid var(--gold);
  }
  .school-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2rem;
    letter-spacing:0.01em;
  }
  .header-right{
    display:flex;
    align-items:baseline;
    gap:1.5rem;
    font-family:'Fraunces', serif;
  }
  .cycle-day{
    font-size:1.5rem;
    font-weight:600;
    color:var(--cream);
    border:2px solid var(--gold);
    border-radius:4px;
    padding:0.1em 0.55em;
    line-height:1.3;
  }
  .cycle-day.is-empty{ display:none; }
  .today-date{
    font-size:1.5rem;
    color:var(--gold);
    font-weight:500;
  }
  .clock{
    font-family:'Public Sans', sans-serif;
    font-size:1.15rem;
    color:#D9D2C0;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Land Acknowledgement band ---------- */
  .land-ack{
    background:var(--green);
    color:var(--cream);
    padding:0.65rem 3rem;
    font-size:1rem;
    display:flex;
    gap:0.6rem;
    align-items:center;
    flex-wrap:wrap;
  }
  .land-ack .label{
    font-weight:700;
    text-transform:none;
    color:var(--gold);
  }
  .land-ack a.label{
    text-decoration:none;
  }
  .land-ack a.label:hover,
  .land-ack a.label:focus-visible{
    text-decoration:underline;
  }

  /* ---------- Main ---------- */
  main{
    flex:1;
    padding:2.2rem 3rem 1.5rem;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.6rem;
    color:var(--navy);
    margin-bottom:0.3rem;
  }
  .section-divider{
    height:2px;
    background:var(--rule);
    margin-bottom:1.2rem;
  }

  #board{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:1.1rem;
  }

  .category{
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .category-header{
    display:flex;
    align-items:baseline;
    gap:0.6rem;
    margin-bottom:0.35rem;
  }
  .category-header .dot{
    width:0.6em;
    height:0.6em;
    border-radius:50%;
    background:var(--gold);
    flex:none;
  }
  .category-header h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--navy);
    text-transform:none;
  }
  .category-body{
    border-top:2px solid var(--rule);
  }

  /* "All Grades" spans the full width and reads first */
  .category.all-grades{ flex:none; }
  .category.all-grades .category-header .dot{ background:var(--green); }

  /* The three grade bands sit side by side beneath it */
  #grade-bands{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:0 2.4rem;
  }
  #grade-bands .category{ min-height:0; overflow:hidden; }
  #grade-bands .category-body{ overflow:hidden; }

  .announcement{
    border-left:4px solid var(--gold);
    padding:0.5em 0 0.5em 0.9em;
    font-size:var(--announcement-size);
    line-height:1.3;
    font-weight:500;
    color:var(--charcoal);
  }
  .category.all-grades .announcement{ border-left-color:var(--green); }
  .announcement + .announcement{
    border-top:1px solid var(--rule);
  }

  .empty-state{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:0.85em;
    color:#8C8574;
    padding:0.6em 0.2em;
  }

  .load-error{
    font-size:0.9rem;
    color:#8A3B2A;
    background:#F6E9E4;
    border:1px solid #E3C6BC;
    padding:0.5rem 0.9rem;
    border-radius:3px;
    margin-bottom:0.6rem;
  }

  @media (max-width:900px){
    #grade-bands{ grid-template-columns:1fr; overflow:visible; }
    body{ overflow:auto; }
  }

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--rule);
    padding:0.8rem 3rem;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:0.9rem;
    color:#6B6456;
    flex-wrap:wrap;
    gap:0.4rem 1.5rem;
  }
  footer a{
    color:var(--navy);
    text-decoration:none;
    font-weight:600;
  }
  footer a:hover{ text-decoration:underline; }
  .footer-links{ display:flex; gap:1.6rem; flex-wrap:wrap; }

  @media (max-width:800px){
    header, main, footer, .land-ack{ padding-left:1.3rem; padding-right:1.3rem; }
    .school-name{ font-size:1.5rem; }
    #announcement-list.two-col{ grid-template-columns:1fr; grid-auto-flow:row; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="school-name">Winchester Public School</div>
  <div class="header-right">
    <span class="cycle-day is-empty" id="cycle-day"></span>
    <span class="today-date" id="today-date"></span>
    <span class="clock" id="clock"></span>
  </div>
</header>

<div class="land-ack">
  <a class="label" href="https://docs.google.com/presentation/d/1Lqx9RY1sD-BVpJ2YF116hvLJPAls3pqaVOrp7pr6FJw/present?slide=id.g37a82bb5aa0_0_20" target="_blank" rel="noopener">Land Acknowledgement &amp; O Canada</a>
  <span>— played each morning before announcements</span>
</div>

<main>
  <div class="section-title">Today's Announcements</div>
  <div class="section-divider"></div>
  <div id="status-area"></div>
  <div id="board">
    <div class="category all-grades" data-category="All Grades">
      <div class="category-header"><span class="dot"></span><h2>All Grades</h2></div>
      <div class="category-body"></div>
    </div>
    <div id="grade-bands">
      <div class="category" data-category="1-3">
        <div class="category-header"><span class="dot"></span><h2>Grades 1–3</h2></div>
        <div class="category-body"></div>
      </div>
      <div class="category" data-category="4-6">
        <div class="category-header"><span class="dot"></span><h2>Grades 4–6</h2></div>
        <div class="category-body"></div>
      </div>
      <div class="category" data-category="7-8">
        <div class="category-header"><span class="dot"></span><h2>Grades 7–8</h2></div>
        <div class="category-body"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span>Winchester Public School — Announcements</span>
  <div class="footer-links">
    <a href="https://docs.google.com/forms/d/e/1FAIpQLScbAXiqhDA92mJq0zoT6u3haegvEa9CDV02jtDQoqWbgcyasQ/viewform" target="_blank" rel="noopener" id="link-add">Add Announcements</a>
    <a href="#" id="link-all">All Announcements</a>
    <a href="#" id="link-lunch">Lunchroom Monitor Schedule</a>
  </div>
</footer>

<script>
  // =================================================================
  // CONFIG — fill these in to connect the live Google Sheet.
  // =================================================================

  // Publish the Form-responses sheet: File → Share → Publish to web →
  // pick the correct tab → format CSV → Publish. Paste that link here.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTxO0rDYe_W4iN0WamHRLrz60MaGbIDgxldixQQImKDEvezFDLO-SklBsQqpuNDFzsWx1Fw0xpS38SB/pub?gid=2072198667&single=true&output=csv";

  // Published CSV of the 5-day Cycle Day calendar. Columns used: Date
  // (col A) and Day (col B) — the sheet has extra unlabeled helper
  // columns further right that are ignored.
  const CYCLE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQypduVC-G5PXvFejWNOYVZ_ZFiq8fjRMkJWtohFG4bqxW9oQ3c1G7Z3-kEfUmLhGkDntT8lMvj95aa/pub?gid=515712952&single=true&output=csv";

  // How the sheet's column headers map to what this page needs.
  // Matching is case-insensitive and just needs to be CONTAINED in the
  // real header text, so "Which grade(s) is this for?" still matches "grade".
  const COLUMN_HINTS = {
    category:  ["category"],
    text:      ["announcement"],
    startDate: ["first date"],
    endDate:   ["last date"],
  };

  // How sheet values map to the four categories on this page.
  // Confirmed against live 2026 submissions — no trailing colon,
  // e.g. "All Grades", "4-6". Add alternate spellings on the left
  // if teachers' form answers ever vary.
  const CATEGORY_MAP = {
    "all grades": "All Grades",
    "all":        "All Grades",
    "1-3":        "1-3",
    "1–3":        "1-3",
    "grades 1-3": "1-3",
    "4-6":        "4-6",
    "4–6":        "4-6",
    "grades 4-6": "4-6",
    "7-8":        "7-8",
    "7–8":        "7-8",
    "grades 7-8": "7-8",
  };

  const CATEGORY_ORDER = ["All Grades", "1-3", "4-6", "7-8"];

  // Auto-refresh interval, in minutes.
  const REFRESH_MINUTES = 5;

  // =================================================================
  // Placeholder data — shown until CSV_URL above is filled in.
  // =================================================================
  const placeholderAnnouncements = [
    { category: "All Grades", text: "Picture Day is this Friday. Please wear your favourite outfit for individual and class photos." },
    { category: "All Grades", text: "Tomorrow is Orange & Black Day — wear your school colours!" },
    { category: "1-3",        text: "Please remember indoor shoes every day — the gym floor is being resurfaced." },
    { category: "1-3",        text: "Kindergarten and Grade 1 library day has moved to Wednesdays." },
    { category: "4-6",        text: "Overdue library books can go in the book drop outside the library any time this week, no late fees." },
    { category: "4-6",        text: "Band practice is cancelled today, back to normal Thursday." },
    { category: "7-8",        text: "Cross country try-outs are at 3:15 today on the back field. Meet Mr. Alvarez at the gym doors." },
    { category: "7-8",        text: "Grade 8 grad photo order forms are due to the office by Monday." },
  ];

  // =================================================================
  // CSV parsing + fetching
  // =================================================================
  function parseCSV(text){
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else { field += c; }
      } else {
        if(c === '"'){ inQuotes = true; }
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
        else if(c === '\r'){ /* skip */ }
        else { field += c; }
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(f => f.trim() !== ""));
  }

  function findColumnIndex(headers, hints){
    const lower = headers.map(h => h.toLowerCase());
    for(const hint of hints){
      const idx = lower.findIndex(h => h.includes(hint));
      if(idx !== -1) return idx;
    }
    return -1;
  }

  function mapCategory(raw){
    if(!raw) return null;
    const key = raw.trim().toLowerCase().replace(/:$/, "");
    return CATEGORY_MAP[key] || null;
  }

  function parseSheetDate(raw){
    if(!raw) return null;
    // Sheet dates come as M/D/YYYY (optionally with a time component).
    const datePart = raw.trim().split(" ")[0];
    const [m, d, y] = datePart.split("/").map(Number);
    if(!m || !d || !y) return null;
    return new Date(y, m - 1, d); // local midnight
  }

  function isActiveToday(startRaw, endRaw){
    const start = parseSheetDate(startRaw);
    if(!start) return false;
    // Blank end date = active for the start date only.
    const end = parseSheetDate(endRaw) || start;
    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    return todayMid >= start && todayMid <= end;
  }

  async function fetchAnnouncements(){
    if(!CSV_URL){
      return { announcements: placeholderAnnouncements, source: "placeholder" };
    }
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("Sheet request failed: " + res.status);
    const rows = parseCSV(await res.text());
    if(rows.length < 2) throw new Error("Sheet returned no data rows");

    const headers = rows[0];
    const catIdx   = findColumnIndex(headers, COLUMN_HINTS.category);
    const textIdx  = findColumnIndex(headers, COLUMN_HINTS.text);
    const startIdx = findColumnIndex(headers, COLUMN_HINTS.startDate);
    const endIdx   = findColumnIndex(headers, COLUMN_HINTS.endDate);
    if(catIdx === -1 || textIdx === -1 || startIdx === -1 || endIdx === -1){
      throw new Error("Couldn't find the expected columns in the sheet headers: " + headers.join(", "));
    }

    const out = [];
    for(let i = 1; i < rows.length; i++){
      const r = rows[i];
      const category = mapCategory(r[catIdx]);
      const text = (r[textIdx] || "").trim();
      if(!category || !text) continue;
      if(!isActiveToday(r[startIdx], r[endIdx])) continue;
      out.push({ category, text });
    }
    return { announcements: out, source: "sheet" };
  }

  // =================================================================
  // Cycle Day
  // =================================================================
  async function fetchCycleDay(){
    if(!CYCLE_CSV_URL) return null;
    const res = await fetch(CYCLE_CSV_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("Cycle day request failed: " + res.status);
    const rows = parseCSV(await res.text());
    const today = new Date();
    const todayMid = new Date(today.getFullYear(), today.getMonth(), today.getDate());

    for(let i = 1; i < rows.length; i++){
      const r = rows[i];
      const rowDate = parseSheetDate(r[0]);
      if(!rowDate) continue;
      if(rowDate.getTime() === todayMid.getTime()){
        const day = (r[1] || "").trim();
        return day || null; // blank = no school / no cycle day today
      }
    }
    return null; // date not found in the calendar at all
  }

  // =================================================================
  // Rendering
  // =================================================================
  const statusEl = document.getElementById('status-area');
  const categoryEls = {};
  document.querySelectorAll('.category').forEach(el => {
    categoryEls[el.dataset.category] = el.querySelector('.category-body');
  });

  function renderBoard(announcements){
    CATEGORY_ORDER.forEach(cat => {
      const body = categoryEls[cat];
      const items = announcements.filter(a => a.category === cat);
      body.innerHTML = "";
      if(items.length === 0){
        body.innerHTML = '<div class="empty-state">Nothing posted today.</div>';
        return;
      }
      items.forEach(a => {
        const div = document.createElement('div');
        div.className = 'announcement';
        div.textContent = a.text;
        body.appendChild(div);
      });
    });
  }

  function showStatus(message, isError){
    if(!message){ statusEl.innerHTML = ""; return; }
    statusEl.innerHTML = `<div class="load-error">${message}</div>`;
  }

  // Auto-fit: shrink font size so the full board fills the screen
  // without scrolling — built for projector and monitor display
  // where nothing should get cut off.
  function fitToScreen(){
    const board = document.getElementById('board');
    const root = document.documentElement;
    let size = 1.8; // rem, starting/max size
    const minSize = 0.72;
    root.style.setProperty('--announcement-size', size + 'rem');

    const fits = () => board.scrollHeight <= board.clientHeight + 2;

    while(!fits() && size > minSize){
      size -= 0.04;
      root.style.setProperty('--announcement-size', size + 'rem');
    }
  }

  function updateDateTime(){
    const now = new Date();
    document.getElementById('today-date').textContent = now.toLocaleDateString(undefined, {
      weekday:'long', month:'long', day:'numeric'
    });
    document.getElementById('clock').textContent = now.toLocaleTimeString(undefined, {
      hour:'numeric', minute:'2-digit'
    });
  }

  async function loadAndRender(){
    try{
      const { announcements, source } = await fetchAnnouncements();
      renderBoard(announcements);
      showStatus(source === "placeholder"
        ? "Showing placeholder announcements — add a Google Sheet CSV link in CSV_URL to go live."
        : "");
    } catch(err){
      showStatus("Couldn't load announcements from the sheet (" + err.message + "). Showing placeholder content instead.");
      renderBoard(placeholderAnnouncements);
    }

    const cycleEl = document.getElementById('cycle-day');
    try{
      const day = await fetchCycleDay();
      if(day){
        cycleEl.textContent = "Day " + day;
        cycleEl.classList.remove('is-empty');
      } else {
        cycleEl.classList.add('is-empty');
      }
    } catch(err){
      cycleEl.classList.add('is-empty'); // fail quietly, it's a secondary feature
    }

    // Refit after DOM + fonts have settled.
    requestAnimationFrame(() => requestAnimationFrame(fitToScreen));
  }

  updateDateTime();
  setInterval(updateDateTime, 15000);

  loadAndRender();
  setInterval(loadAndRender, REFRESH_MINUTES * 60 * 1000);

  window.addEventListener('resize', fitToScreen);
</script>

</body>
</html>

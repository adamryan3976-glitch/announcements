<script>
(function () {
  'use strict';

  /* =========================================================
   * State and small helpers
   * ========================================================= */
  var state = {
    me: null, settings: null, grades: [], today: null, appUrl: '',
    view: 'today', viewArg: '', filter: store('grade') || 'all',
    previewDate: '', refreshTimer: null, adminTab: 'staff', mineTab: 'current'
  };
  var DAYS = [['Mon', 'Mon'], ['Tue', 'Tue'], ['Wed', 'Wed'], ['Thu', 'Thu'], ['Fri', 'Fri']];
  var GRADE_LABEL = { 'all': 'All Grades', '1-3': 'Grades 1–3', '4-6': 'Grades 4–6', '7-8': 'Grades 7–8' };
  var view = document.getElementById('view');

  function store(key, value) {
    try {
      if (value === undefined) return window.localStorage.getItem('wps-' + key);
      window.localStorage.setItem('wps-' + key, value);
    } catch (e) { return null; }
  }

  /** Element builder. Text is always set as text, never as HTML. */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
        else if (k === 'value') el.value = v;
        else if (k === 'checked') el.checked = !!v;
        else el.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  }
  function append(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { append(el, k); }); return; }
    el.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

  /** google.script.run as a promise. */
  function api(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        reject(new Error(err && err.message ? err.message.replace(/^Exception: /, '') : String(err)));
      });
      runner[name].apply(runner, args);
    });
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
  }

  function isStaff() { return state.me && (state.me.role === 'staff' || state.me.role === 'admin'); }
  function isAdmin() { return state.me && state.me.role === 'admin'; }

  function parseDate(s) { var p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function iso(d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function todayIso() { return iso(new Date()); }
  function longDate(s) { return parseDate(s).toLocaleDateString('en-CA', { weekday: 'long', month: 'long', day: 'numeric' }); }
  function shortDate(s) { return parseDate(s).toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }); }
  function addDays(s, n) { var d = parseDate(s); d.setDate(d.getDate() + n); return iso(d); }
  function dateRange(a) {
    if (!a.startDate) return '';
    var s = a.startDate === a.endDate ? shortDate(a.startDate) : shortDate(a.startDate) + ' to ' + shortDate(a.endDate);
    if (a.daysOfWeek && a.daysOfWeek.length) s += ' (' + a.daysOfWeek.join(', ') + ' only)';
    return s;
  }
  function gradeText(codes) { return (codes || []).map(function (c) { return GRADE_LABEL[c] || c; }).join(', '); }

  /** Splits text into text nodes and safe links. */
  function linkify(text) {
    var out = [], re = /(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)])/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) out.push(text.slice(last, m.index));
      out.push(h('a', { href: m[1], target: '_blank', rel: 'noopener', text: m[1] }));
      last = m.index + m[1].length;
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  }

  /* ---------- Photos load through the server so sharing rules never get in the way ---------- */
  var photoCache = {};
  function photoSrc(id) {
    if (!photoCache[id]) photoCache[id] = api('getPhoto', id);
    return photoCache[id];
  }
  function photoImg(id, cls) {
    var img = h('img', { alt: 'Photo', class: cls || '', loading: 'lazy' });
    photoSrc(id).then(function (src) { img.src = src; }).catch(function () { img.alt = 'Photo unavailable'; });
    return img;
  }

  function videoEmbed(url) {
    if (!url) return '';
    var m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) return 'https://www.youtube-nocookie.com/embed/' + m[1];
    m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{20,})/i);
    if (m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
    return '';
  }

  /* =========================================================
   * Announcement card (used on Today and in the editor preview)
   * ========================================================= */
  function card(a, opts) {
    opts = opts || {};
    var media = [];
    if (a.photoIds && a.photoIds.length) {
      media.push(h('div', { class: 'ann-photos' }, a.photoIds.map(function (id) {
        return opts.localPhotos && opts.localPhotos[id] ? h('img', { src: opts.localPhotos[id], alt: 'Photo' }) : photoImg(id);
      })));
    }
    var embed = a.videoEmbed || videoEmbed(a.videoUrl);
    if (embed) {
      media.push(h('div', { class: 'ann-video' }, h('iframe', {
        src: embed, title: 'Video', allow: 'encrypted-media; picture-in-picture; fullscreen', allowfullscreen: true, loading: 'lazy'
      })));
    }
    if (a.linkUrl) {
      media.push(h('a', { class: 'btn small ann-link', href: a.linkUrl, target: '_blank', rel: 'noopener', text: a.linkLabel || 'Open link' }));
    }
    return h('article', { class: 'ann' + (a.important ? ' important' : '') },
      a.important ? h('span', { class: 'ann-flag', text: 'Important' }) : null,
      a.title ? h('h3', { text: a.title }) : null,
      h('p', { class: 'ann-body' }, linkify(a.body || '')),
      media.length ? h('div', { class: 'ann-media' }, media) : null,
      opts.meta !== false && a.authorName ? h('div', { class: 'ann-meta' }, h('span', { text: 'From ' + a.authorName })) : null
    );
  }

  /* =========================================================
   * Navigation
   * ========================================================= */
  var VIEWS = {
    today: { label: 'Today', render: renderToday },
    new: { label: 'New announcement', render: renderEditor, staff: true },
    edit: { render: renderEditor, staff: true },
    mine: { label: 'My announcements', render: renderMine, staff: true },
    all: { label: 'All announcements', render: renderArchive, staff: true },
    admin: { label: 'Admin', render: renderAdmin, admin: true },
  };

  function renderNav() {
    var nav = clear(document.getElementById('nav'));
    ['today', 'new', 'mine', 'all', 'admin'].forEach(function (key) {
      var v = VIEWS[key];
      if (v.staff && !isStaff()) return;
      if (v.admin && !isAdmin()) return;
      var current = state.view === key || (key === 'new' && state.view === 'edit');
      nav.appendChild(h('a', {
        href: '#' + key, 'aria-current': current ? 'page' : null,
        onclick: function (e) { e.preventDefault(); go(key); }
      }, v.label));
    });
  }

  function go(key, arg, opts) {
    if (!VIEWS[key]) key = 'today';
    if ((VIEWS[key].staff && !isStaff()) || (VIEWS[key].admin && !isAdmin())) key = 'today';
    state.view = key;
    state.viewArg = arg || '';
    if (!(opts && opts.noHistory) && window.google && google.script && google.script.history) {
      google.script.history.push({ view: key, arg: state.viewArg }, null, key + (state.viewArg ? '/' + state.viewArg : ''));
    }
    renderNav();
    clear(view);
    VIEWS[key].render(state.viewArg, opts && opts.data);
    view.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  function pageHead(title, sub, actions) {
    return h('div', { class: 'page-head' },
      h('div', null, h('h1', { text: title }), sub ? h('p', { text: sub }) : null),
      actions ? h('div', { class: 'day-actions' }, actions) : null);
  }

  function showError(where, err) {
    clear(where).appendChild(h('p', { class: 'error', text: err.message || String(err) }));
  }

  /* =========================================================
   * Today
   * ========================================================= */
  function shield(cycleDay) {
    var svg = '<svg viewBox="0 0 92 104" aria-hidden="true"><path d="M46 3 L88 14 V50 C88 76 70 93 46 101 C22 93 4 76 4 50 V14 Z" fill="#E9A92B" stroke="#3A2410" stroke-width="3"/><path d="M46 11 L80 20 V50 C80 71 66 85 46 92 C26 85 12 71 12 50 V20 Z" fill="none" stroke="#3A2410" stroke-opacity=".4" stroke-width="1.5"/></svg>';
    var wrap = h('div', { class: 'shield' + (cycleDay ? '' : ' no-school'), role: 'img', 'aria-label': cycleDay ? 'Day ' + cycleDay : 'No cycle day' });
    wrap.innerHTML = svg; // static markup only
    wrap.appendChild(cycleDay
      ? h('div', { class: 'shield-text' }, h('small', { text: 'Day' }), h('strong', { text: cycleDay }))
      : h('div', { class: 'shield-text' }, h('strong', { text: 'No cycle' })));
    return wrap;
  }

  function groupedAnnouncements(t, filter) {
    var groups = [];
    state.grades.forEach(function (g) {
      if (filter !== 'all' && g.code !== 'all' && g.code !== filter) return;
      var items = t.announcements.filter(function (a) { return a.grades.indexOf(g.code) !== -1; });
      groups.push({ code: g.code, label: g.label, items: items });
    });
    return groups;
  }

  function renderToday() {
    var t = state.today;
    if (!t) { view.appendChild(h('p', { class: 'loading', text: 'Loading…' })); return; }
    var s = state.settings;

    var actions = [
      h('button', { class: 'btn gold', type: 'button', onclick: function () { openPresent(0); } }, 'Present to class')
    ];
    if (isStaff()) {
      actions.push(h('button', { class: 'btn primary', type: 'button', onclick: function () { go('new'); } }, 'New announcement'));
    }

    var sub = t.isToday ? (t.cycleDay ? 'Cycle day ' + t.cycleDay : 'No cycle day today') : 'Previewing another day';
    var dayline = h('section', { class: 'dayline', 'aria-label': 'Today' },
      shield(t.cycleDay),
      h('div', null,
        h('h1', { class: 'date-big', text: longDate(t.date) }),
        h('p', { class: 'date-sub', text: sub }),
        isStaff() ? h('label', { class: 'hint' }, 'Preview another day: ',
          h('input', { type: 'date', value: t.date, style: 'width:auto;padding:.2rem .4rem', onchange: function (e) { loadToday(e.target.value); } })) : null),
      h('div', { class: 'day-actions' }, actions));

    var strip = h('section', { class: 'strip', 'aria-label': 'Daily items' });
    if (s.landAcknowledgement || s.oCanadaVideoUrl || s.openingSlidesUrl) {
      strip.appendChild(h('div', { class: 'strip-item opening' },
        h('div', null, h('h2', { text: 'Start of day' }), h('p', { text: 'Land Acknowledgement and O Canada' })),
        (s.landAcknowledgement || s.oCanadaVideoUrl)
          ? h('button', { class: 'btn small', type: 'button', onclick: function () { openPresent(0, { openingOnly: true }); } }, 'Play opening')
          : h('a', { class: 'btn small', href: s.openingSlidesUrl, target: '_blank', rel: 'noopener' }, 'Open slides')));
    }
    if (t.trait) {
      strip.appendChild(h('div', { class: 'strip-item trait' }, h('h2', { text: 'Character education' }), h('p', { text: t.trait })));
    }
    var b = t.birthdays || { today: [], earlier: [] };
    if (b.today.length || b.earlier.length) {
      strip.appendChild(h('div', { class: 'strip-item birthdays' },
        h('h2', { text: 'Happy birthday' }),
        b.today.length ? h('p', { text: b.today.join(', ') }) : null,
        b.earlier.length ? h('p', { class: 'earlier', text: (b.today.length ? 'Also over the weekend: ' : 'Over the weekend: ') + b.earlier.join(', ') }) : null));
    }

    var filter = h('div', { class: 'filter', role: 'group', 'aria-label': 'Show grades' },
      h('span', { class: 'filter-label', text: 'Show' }),
      [['all', 'All grades'], ['1-3', 'Grades 1–3'], ['4-6', 'Grades 4–6'], ['7-8', 'Grades 7–8']].map(function (f) {
        return h('button', {
          class: 'chip', type: 'button', 'aria-pressed': state.filter === f[0] ? 'true' : 'false',
          onclick: function () { state.filter = f[0]; store('grade', f[0]); go('today', '', { noHistory: true }); }
        }, f[1]);
      }));

    var board = h('section', { class: 'board columns', 'aria-label': 'Announcements' });
    if (isStaff() && t.staffNotes && t.staffNotes.length) {
      board.appendChild(h('div', { class: 'group all staff' },
        h('h2', { text: 'For staff only' }),
        t.staffNotes.map(function (a) { return card(a); })));
    }
    groupedAnnouncements(t, state.filter).forEach(function (g) {
      board.appendChild(h('div', { class: 'group' + (g.code === 'all' ? ' all' : '') },
        h('h2', { text: g.label }),
        g.items.length ? g.items.map(function (a) { return card(a); }) : h('p', { class: 'empty', text: 'Nothing posted today.' })));
    });

    var foot = h('div', { class: 'footer-note' },
      s.lunchMonitorUrl ? h('a', { href: s.lunchMonitorUrl, target: '_blank', rel: 'noopener', text: 'Full lunchroom monitor schedule' }) : null,
      s.openingSlidesUrl ? h('a', { href: s.openingSlidesUrl, target: '_blank', rel: 'noopener', text: 'Land Acknowledgement and O Canada slides' }) : null);

    append(view, [dayline, strip.childNodes.length ? strip : null, monitorsSection(t.lunch), filter, board, foot]);
  }

  /* ---------- Lunchroom monitors (from the principal's sheet) ---------- */
  function hasMonitors(lunch) { return !!(lunch && lunch.rooms && lunch.rooms.length); }

  function monitorsSection(lunch) {
    if (!lunch) return null;
    var head = h('h2', { text: 'Lunchroom monitors' });
    if (lunch.error || lunch.unavailable) {
      return h('section', { class: 'monitors', 'aria-label': 'Lunchroom monitors' }, head,
        h('p', { class: 'notice', text: lunch.error
          ? 'Today’s lunchroom schedule couldn’t load. ' + lunch.error
          : 'Today’s lunchroom schedule isn’t available right now. Check with your teacher.' }));
    }
    if (!hasMonitors(lunch)) return null;
    return h('section', { class: 'monitors', 'aria-label': 'Lunchroom monitors' }, head,
      h('div', { class: 'rooms' }, lunch.rooms.map(function (r) {
        return h('article', { class: 'room' },
          h('h3', { text: r.room }),
          h('dl', null, r.duties.map(function (d) {
            return [h('dt', { text: d.duty }), h('dd', { text: d.names.join(', ') })];
          })));
      })));
  }

  function loadToday(date) {
    state.previewDate = date && date !== todayIso() ? date : '';
    return api('getToday', state.previewDate || null).then(function (t) {
      state.today = t;
      if (state.view === 'today') { clear(view); renderToday(); }
    }).catch(function (err) { toast(err.message); });
  }

  function scheduleRefresh() {
    clearInterval(state.refreshTimer);
    var minutes = (state.settings && state.settings.refreshMinutes) || 5;
    state.refreshTimer = setInterval(function () {
      if (state.view === 'today' && !state.previewDate && document.getElementById('present').hidden) loadToday();
    }, minutes * 60000);
  }

  /* =========================================================
   * Present mode
   * ========================================================= */
  var present = { slides: [], index: 0 };

  function buildSlides(opts) {
    var t = state.today, s = state.settings, slides = [];
    var embed = videoEmbed(s.oCanadaVideoUrl);
    if (s.landAcknowledgement || embed) {
      slides.push(function () {
        return h('div', { class: 'slide opening' },
          h('div', { class: 'slide-kicker', text: 'Start of day' }),
          s.landAcknowledgement ? [h('h2', { text: 'Land Acknowledgement' }), h('p', { class: 'slide-body', text: s.landAcknowledgement })] : null,
          embed ? [h('h2', { text: 'O Canada' }), h('div', { class: 'slide-video' }, h('iframe', { src: embed, title: 'O Canada', allow: 'autoplay; encrypted-media; fullscreen', allowfullscreen: true }))] : null);
      });
    }
    if (opts && opts.openingOnly) return slides;

    slides.push(function () {
      var b = t.birthdays || { today: [], earlier: [] };
      var names = b.today.concat(b.earlier);
      return h('div', { class: 'slide slide-cover' },
        h('div', { class: 'cover-head' },
          h('img', { class: 'cover-crest', src: logoUrl(), alt: '', onerror: function (e) { e.target.remove(); } }),
          h('div', null,
            h('div', { class: 'slide-kicker', text: state.settings.schoolName }),
            h('p', { class: 'big', text: longDate(t.date).replace(/ (\d+)$/, '\u00a0$1') }))),
        h('div', { class: 'facts' },
          t.cycleDay ? h('div', null, h('b', { text: 'Day ' + t.cycleDay })) : null,
          t.trait ? h('div', { text: t.trait }) : null,
          names.length ? h('div', null, h('b', { text: 'Happy birthday: ' }), names.join(', ')) : null));
    });

    if (hasMonitors(t.lunch)) {
      slides.push(function () {
        return h('div', { class: 'slide slide-monitors' },
          h('div', { class: 'slide-kicker', text: 'Where to go today' }),
          h('h2', { text: 'Lunchroom monitors' }),
          h('div', { class: 'slide-rooms' }, t.lunch.rooms.map(function (r) {
            return h('div', { class: 'slide-room' },
              h('h3', { text: r.room }),
              r.duties.map(function (d) {
                return h('p', null, h('b', { text: d.duty + ': ' }), d.names.join(', '));
              }));
          })));
      });
    }

    var seen = {};
    groupedAnnouncements(t, state.filter).forEach(function (g) {
      g.items.forEach(function (a) {
        if (seen[a.id]) return; // an announcement for two grade groups is shown once
        seen[a.id] = true;
        slides.push(function () {
          var embedUrl = a.videoEmbed || videoEmbed(a.videoUrl);
          return h('div', { class: 'slide' },
            h('div', { class: 'slide-kicker', text: gradeText(a.grades) + (a.important ? ' — Important' : '') }),
            a.title ? h('h2', { text: a.title }) : null,
            h('p', { class: 'slide-body' }, a.body),
            a.photoIds && a.photoIds.length ? h('div', { class: 'slide-photos' }, a.photoIds.map(function (id, i) {
              return h('button', { type: 'button', class: 'slide-photo', 'aria-label': 'Show photo ' + (i + 1) + ' full screen',
                onclick: function (e) { e.stopPropagation(); openZoom(a.photoIds, i); } }, photoImg(id));
            })) : null,
            embedUrl ? h('div', { class: 'slide-video' }, h('iframe', { src: embedUrl, title: 'Video', allow: 'encrypted-media; fullscreen', allowfullscreen: true })) : null,
            a.linkUrl ? h('div', { class: 'slide-link', text: (a.linkLabel || 'Link') + ': ' + a.linkUrl }) : null,
            a.authorName ? h('div', { class: 'slide-meta', text: 'From ' + a.authorName }) : null);
        });
      });
    });
    if (slides.length <= 1) {
      slides.push(function () { return h('div', { class: 'slide' }, h('h2', { text: 'No announcements today.' })); });
    }
    return slides;
  }

  function openPresent(start, opts) {
    present.slides = buildSlides(opts);
    present.index = start || 0;
    var p = document.getElementById('present');
    p.hidden = false;
    document.body.style.overflow = 'hidden';
    try { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } catch (e) {}
    showSlide();
    document.getElementById('present-next').focus();
  }

  /* ---------- Full-screen photo inside Present mode ---------- */
  var zoom = null;

  function openZoom(ids, index) {
    closeZoom();
    zoom = { ids: ids, index: index, el: h('div', { class: 'zoom', role: 'dialog', 'aria-label': 'Photo', onclick: closeZoom }) };
    document.getElementById('present').appendChild(zoom.el);
    drawZoom();
  }

  function drawZoom() {
    var el = clear(zoom.el), many = zoom.ids.length > 1;
    var step = function (d) { return function (e) { e.stopPropagation(); moveZoom(d); }; };
    append(el, [
      photoImg(zoom.ids[zoom.index], 'zoom-img'),
      h('div', { class: 'zoom-bar' },
        many ? h('span', { class: 'present-count', text: 'Photo ' + (zoom.index + 1) + ' of ' + zoom.ids.length }) : h('span'),
        h('div', { class: 'present-controls' },
          many ? h('button', { type: 'button', class: 'present-btn', onclick: step(-1), disabled: zoom.index === 0 }, '‹ Back') : null,
          many ? h('button', { type: 'button', class: 'present-btn', onclick: step(1), disabled: zoom.index === zoom.ids.length - 1 }, 'Next ›') : null,
          h('button', { type: 'button', class: 'present-btn', id: 'zoom-close', onclick: function (e) { e.stopPropagation(); closeZoom(); } }, 'Close photo')))
    ]);
    document.getElementById('zoom-close').focus();
  }

  function moveZoom(d) {
    var i = zoom.index + d;
    if (i < 0 || i >= zoom.ids.length) return;
    zoom.index = i;
    drawZoom();
  }

  function closeZoom() {
    if (!zoom) return;
    zoom.el.remove();
    zoom = null;
    document.getElementById('present-next').focus();
  }

  function closePresent() {
    closeZoom();
    document.getElementById('present').hidden = true;
    clear(document.getElementById('present-stage'));
    document.body.style.overflow = '';
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
  }

  function showSlide() {
    var stage = clear(document.getElementById('present-stage'));
    var total = present.slides.length;
    present.index = Math.max(0, Math.min(present.index, total - 1));
    var slide = present.slides[present.index]();
    stage.appendChild(slide);
    document.getElementById('present-count').textContent = (present.index + 1) + ' of ' + total;
    document.getElementById('present-prev').disabled = present.index === 0;
    document.getElementById('present-next').textContent = present.index === total - 1 ? 'Finish' : 'Next ›';
    var prog = clear(document.getElementById('present-progress'));
    for (var i = 0; i < total; i++) prog.appendChild(h('span', { class: i <= present.index ? 'on' : '' }));
    fitSlide(stage, slide);
  }

  /** Largest type that still fits the screen, so short notes read from the back row. */
  function fitSlide(stage, slide) {
    var size = Math.min(window.innerWidth / 14, window.innerHeight / 7, 96);
    var min = 18;
    stage.style.fontSize = size + 'px';
    var fits = function () { return slide.scrollHeight <= stage.clientHeight - 24 && slide.scrollWidth <= stage.clientWidth; };
    while (!fits() && size > min) { size -= 2; stage.style.fontSize = size + 'px'; }
  }

  function nextSlide() { if (present.index >= present.slides.length - 1) closePresent(); else { present.index++; showSlide(); } }
  function prevSlide() { if (present.index > 0) { present.index--; showSlide(); } }

          h('div', { class: 'inline-form', style: 'grid-template-columns:1fr auto' }, email,
            h('button', { class: 'btn primary', type: 'button', onclick: function () {
              api('addAdmin', email.value).then(function (r) { draw(r); toast('Admin added. They can open Admin the next time they load the site.'); }).catch(function (err) { toast(err.message); });
            } }, 'Make admin')))]);
    };
    api('listAdmins').then(draw).catch(function (err) { showError(body, err); });
  }

  function adminBirthdays(body) {
    api('birthdayStatus').then(function (st) {
      clear(body);
      var result = h('div');
      var fileIn = h('input', { type: 'file', accept: '.xlsx,.xls,.csv', 'aria-label': 'Class list file' });
      var go1 = h('button', { type: 'button', class: 'btn primary', onclick: function () {
        var f = fileIn.files[0];
        if (!f) { toast('Choose the Excel file first.'); return; }
        go1.disabled = true;
        readFile(f).then(function (b64) { return api('importBirthdays', b64, f.name, false, null); }).then(function (p) {
          go1.disabled = false;
          clear(result).appendChild(h('div', { class: 'panel' },
            h('h2', { text: 'Found ' + p.count + ' students' }),
            p.skipped ? h('p', { class: 'hint', text: p.skipped + ' rows were skipped because a name or birth date was missing.' }) : null,
            h('p', { class: 'hint', text: 'Columns used: ' + Object.keys(p.columns).map(function (k) { return k + ' = “' + p.columns[k] + '”'; }).join(', ') }),
            h('table', { class: 'simple' }, h('thead', null, h('tr', null, h('th', { text: 'Shown as' }), h('th', { text: 'Birthday' }), h('th', { text: 'Grade' }), h('th', { text: 'Homeroom' }))),
              h('tbody', null, p.sample.map(function (r) {
                return h('tr', null, h('td', { text: r.name }), h('td', { text: new Date(2000, r.month - 1, r.day).toLocaleDateString('en-CA', { month: 'long', day: 'numeric' }) }), h('td', { text: r.grade }), h('td', { text: r.homeroom }));
              }))),
            h('div', null, h('button', { type: 'button', class: 'btn primary', onclick: function (e) {
              e.target.disabled = true;
              api('importBirthdays', null, null, true, p.token).then(function (r) { toast('Birthday list replaced (' + r.saved + ' students)'); adminBirthdays(body); })
                .catch(function (err) { e.target.disabled = false; toast(err.message); });
            } }, 'Replace the birthday list'))));
        }).catch(function (err) { go1.disabled = false; clear(result).appendChild(h('p', { class: 'error', text: err.message })); });
      } }, 'Check the file');
      append(body, [
        h('div', { class: 'panel' }, h('h2', { text: 'Birthday list' }),
          h('p', { text: st.count + ' students' + (st.updated ? ', last updated ' + shortDate(st.updated) : '') + '.' }),
          h('p', { class: 'hint', text: 'Upload the class list export from the LMS (Excel or CSV) whenever class lists change. It needs a name column and a birth date column. Only first name, last initial, month and day are kept — no birth years.' }),
          h('div', { class: 'inline-form', style: 'grid-template-columns:1fr auto' }, fileIn, go1)),
        result]);
    }).catch(function (err) { showError(body, err); });
  }

  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(String(r.result).split(',')[1]); };
      r.onerror = function () { reject(new Error('Couldn’t read that file.')); };
      r.readAsDataURL(file);
    });
  }

  var SETTING_FIELDS = [
    ['schoolName', 'School name', 'text', 'Shown at the top of every page.'],
    ['siteTitle', 'Browser tab title', 'text', ''],
    ['logoUrl', 'Knights logo', 'url', 'Link to the logo image (a public image link, or a Drive image shared with the school).'],
    ['landAcknowledgement', 'Land Acknowledgement', 'textarea', 'Shown on the opening slide in Present mode. Leave blank to use the slides link instead.'],
    ['oCanadaVideoUrl', 'O Canada video', 'url', 'YouTube or Drive link played on the opening slide.'],
    ['openingSlidesUrl', 'Opening slides link', 'url', 'The existing Land Acknowledgement and O Canada slides.'],
    ['lunchMonitorUrl', 'Lunchroom monitor schedule', 'url', 'The principal’s sheet. Today’s monitors are shown on Today and in Present mode. The account that deployed the site needs view access.'],
    ['lunchMonitorTab', 'Lunchroom sheet tab', 'text', 'The tab with Monday–Friday across the top and one row per room. Normally Input.'],
    ['staffDomain', 'Staff email domain', 'text', 'Accounts ending in this can post. Normally ddsb.ca.'],
    ['studentDomain', 'Student email domain', 'text', 'Accounts ending in this see Today only. Normally ddsbstudent.ca.'],
    ['refreshMinutes', 'Refresh Today every (minutes)', 'text', ''],
    ['maxPhotos', 'Photos per announcement', 'text', '']
  ];

  function adminSettings(body) {
    api('getSettingsForAdmin').then(function (values) {
      clear(body);
      var inputs = {};
      var form = h('form', { class: 'form', style: 'max-width:760px', onsubmit: function (e) {
        e.preventDefault();
        var out = {};
        Object.keys(inputs).forEach(function (k) { out[k] = inputs[k].value; });
        api('saveSettings', out).then(function () {
          toast('Settings saved');
          return api('getBootstrap');
        }).then(applyBootstrap).catch(function (err) { toast(err.message); });
      } }, SETTING_FIELDS.map(function (f) {
        var el = f[2] === 'textarea'
          ? h('textarea', { id: 's-' + f[0], value: values[f[0]] || '' })
          : h('input', { id: 's-' + f[0], type: f[2], value: values[f[0]] || '' });
        inputs[f[0]] = el;
        return h('div', { class: 'field' }, h('label', { for: 's-' + f[0], text: f[1] }), f[3] ? h('span', { class: 'hint', text: f[3] }) : null, el);
      }), h('div', { class: 'form-actions' }, h('button', { type: 'submit', class: 'btn primary', text: 'Save settings' })));
      body.appendChild(form);
    }).catch(function (err) { showError(body, err); });
  }

  function adminLegacy(body) {
    api('legacySyncStatus').then(function (st) {
      clear(body);
      var out = h('p');
      var link = h('input', { type: 'url', id: 'legacy-url', value: st.formUrl || '', placeholder: 'https://docs.google.com/forms/d/…/edit' });
      var saveLink = h('button', { class: 'btn', type: 'button', onclick: function () {
        saveLink.disabled = true;
        api('setLegacyForm', link.value).then(function () { toast('Form saved'); adminLegacy(body); })
          .catch(function (err) { saveLink.disabled = false; toast(err.message); });
      } }, 'Use this form');
      append(body, h('div', { class: 'panel' },
        h('h2', { text: 'Old Google Form' }),
        h('p', { text: 'While staff are still using the old form, its responses can be copied into this site. Already-copied responses are skipped.' }),
        h('div', { class: 'field' },
          h('label', { for: 'legacy-url', text: 'Form to copy from' }),
          h('span', { class: 'hint', text: 'Open the form for editing and paste the address from the browser. Share links (forms.gle) won’t work. Leave blank to use the “Form Responses 2” tab of the sheet.' }),
          h('div', { class: 'inline-form', style: 'grid-template-columns:1fr auto' }, link, saveLink)),
        h('p', { class: 'hint', text: 'Copying from ' + st.source + '.' }),
        st.problem ? h('p', { class: 'error', text: st.problem }) : null,
        h('div', { class: 'checks' },
          h('button', { class: 'btn primary', type: 'button', onclick: function () {
            api('importLegacy').then(function (r) { out.textContent = 'Copied ' + r.imported + ' new announcements.'; loadToday(); }).catch(function (err) { toast(err.message); });
          } }, 'Copy new responses now'),
          st.installed
            ? h('button', { class: 'btn', type: 'button', onclick: function () { api('removeLegacyFormSync').then(function () { toast('Automatic copying stopped'); adminLegacy(body); }); } }, 'Stop copying automatically')
            : h('button', { class: 'btn', type: 'button', onclick: function () { api('installLegacyFormSync').then(function () { toast('New form responses will be copied automatically'); adminLegacy(body); }); } }, 'Copy automatically on each response')),
        h('p', { class: 'hint', text: st.installed ? 'Automatic copying is on.' : 'Automatic copying is off.' }),
        out));
    }).catch(function (err) { showError(body, err); });
  }

  /* =========================================================
   * Start up
   * ========================================================= */
  /** The crest from Settings, or the one kept in the GitHub repo. */
  function logoUrl() {
    return (state.settings && state.settings.logoUrl) ||
      'https://raw.githubusercontent.com/adamryan3976-glitch/announcements/main/icons/logo-512.png';
  }

  function applyBootstrap(b) {
    state.me = b.me; state.settings = b.settings; state.grades = b.grades; state.appUrl = b.appUrl;
    if (b.today) state.today = b.today;
    document.getElementById('brand-name').textContent = b.settings.schoolName || 'Winchester Public School';
    var logo = document.getElementById('brand-logo');
    logo.onerror = function () { logo.hidden = true; };
    logo.src = logoUrl();
    logo.hidden = false;
  }

  function start() {
    api('getBootstrap').then(function (b) {
      applyBootstrap(b);
      var startView = (window.INITIAL_VIEW || '').split('/');
      var go1 = function (hash) {
        var parts = (hash || '').replace(/^#/, '').split('/');
        var key = parts[0] || startView[0] || 'today';
        go(key, parts[1] || startView[1] || '', { noHistory: true });
      };
      if (window.google && google.script && google.script.url) google.script.url.getLocation(function (loc) { go1(loc.hash); });
      else go1(location.hash);
      scheduleRefresh();
    }).catch(function (err) {
      clear(view).appendChild(h('p', { class: 'error', text: 'The announcements couldn’t load: ' + err.message }));
    });
    if (window.google && google.script && google.script.history) {
      google.script.history.setChangeHandler(function (e) {
        var s = e.state || {};
        go(s.view || 'today', s.arg || '', { noHistory: true });
      });
    }
  }

  start();
})();
</script>
